# Vorübergehend: Bildschirmfotos klein ins Log schreiben, um sie ohne Artefakt-Download ansehen zu können.
name: Vorschau
on: push
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest --tests '*SpielAblaufTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vorschau
          path: app/build/bildschirmfotos/
  zeigen:
    needs: fotos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vorschau
          path: fotos
      - run: |
          pip install -q pillow
          cd fotos; ls -la
          cat > ascii.py <<'PY'
          import sys
          from PIL import Image
          PAL = [((255,255,255),' '),((234,246,249),' '),((142,212,232),'.'),((214,240,247),'.'),((15,127,160),'~'),((122,218,240),'-'),
                 ((14,116,144),'='),((11,60,73),'#'),((255,107,74),'o'),((242,184,121),'s'),((255,217,102),'*'),((91,124,138),'T'),
                 ((143,170,181),'t'),((156,203,143),'g'),((79,154,91),'G'),((227,238,241),':'),((230,238,241),':'),((46,158,107),'+'),((0,0,0),'@')]
          def ch(p):
              return min(PAL, key=lambda c: sum((a-b)**2 for a,b in zip(p,c[0])))[1]
          for f in sys.argv[1:]:
              im = Image.open(f).convert('RGB')
              w, h = im.size
              W = 72; H = int(h / w * W / 2)
              im = im.resize((W, H))
              print('=====', f, w, 'x', h)
              for y in range(H):
                  print(''.join(ch(im.getpixel((x, y))) for x in range(W)))
          PY
          python3 ascii.py 2-bereit.png 3-anlauf.png 4-salto.png 5-ergebnis.png
