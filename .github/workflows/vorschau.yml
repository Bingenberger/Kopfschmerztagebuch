# Vorübergehend: Bildschirmfotos klein ins Log schreiben, um sie ohne Artefakt-Download ansehen zu können.
name: Vorschau
on: push
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest --tests '*SpielAblaufTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vorschau
          path: app/build/bildschirmfotos/
  zeigen:
    needs: fotos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vorschau
          path: fotos
      - run: |
          pip install -q pillow
          cd fotos; ls -la
          for f in 2-bereit.png 3-anlauf.png 5-ergebnis.png; do
            python3 -c "
          import sys,base64,io
          from PIL import Image
          im=Image.open('$f').convert('RGB'); im.thumbnail((240,540)); b=io.BytesIO(); im.save(b,'JPEG',quality=40)
          print('=====BILD $f'); print(base64.b64encode(b.getvalue()).decode()); print('=====ENDE')" || echo "Fehler bei $f"
          done
